<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Escudo simplificado de la Republica Dominicana -->
  <!-- Ramas de olivo (izq) y palma (der) -->
  <g opacity="0.9">
    <!-- Rama olivo izquierda -->
    <path d="M40,180 Q20,140 30,100 Q25,90 35,80 Q30,70 40,60" fill="none" stroke="#2d6a2d" stroke-width="3"/>
    <ellipse cx="28" cy="75" rx="8" ry="5" fill="#3a8c3a" transform="rotate(-30,28,75)"/>
    <ellipse cx="25" cy="90" rx="8" ry="5" fill="#3a8c3a" transform="rotate(-20,25,90)"/>
    <ellipse cx="27" cy="105" rx="8" ry="5" fill="#3a8c3a" transform="rotate(-15,27,105)"/>
    <ellipse cx="30" cy="120" rx="8" ry="5" fill="#3a8c3a" transform="rotate(-10,30,120)"/>
    <ellipse cx="32" cy="135" rx="8" ry="5" fill="#3a8c3a" transform="rotate(-5,32,135)"/>
    <ellipse cx="33" cy="150" rx="8" ry="5" fill="#3a8c3a" transform="rotate(0,33,150)"/>
    <ellipse cx="35" cy="165" rx="8" ry="5" fill="#3a8c3a" transform="rotate(5,35,165)"/>
    <!-- Rama palma derecha -->
    <path d="M160,180 Q180,140 170,100 Q175,90 165,80 Q170,70 160,60" fill="none" stroke="#2d6a2d" stroke-width="3"/>
    <path d="M170,75 Q185,65 195,70 Q185,75 170,75Z" fill="#3a8c3a"/>
    <path d="M173,90 Q190,82 198,88 Q188,92 173,90Z" fill="#3a8c3a"/>
    <path d="M172,105 Q188,98 196,105 Q186,108 172,105Z" fill="#3a8c3a"/>
    <path d="M170,120 Q186,114 194,122 Q184,124 170,120Z" fill="#3a8c3a"/>
    <path d="M168,135 Q184,130 192,138 Q182,140 168,135Z" fill="#3a8c3a"/>
    <path d="M166,150 Q182,146 190,154 Q180,156 166,150Z" fill="#3a8c3a"/>
    <path d="M164,165 Q180,162 186,170 Q176,172 164,165Z" fill="#3a8c3a"/>
  </g>

  <!-- Escudo central -->
  <rect x="55" y="55" width="90" height="100" rx="5" fill="#003893" stroke="#c8a415" stroke-width="2"/>
  <!-- Cruz central -->
  <line x1="100" y1="55" x2="100" y2="155" stroke="#c41e3a" stroke-width="12"/>
  <line x1="55" y1="105" x2="145" y2="105" stroke="#c41e3a" stroke-width="12"/>
  <!-- Cuadrantes -->
  <rect x="57" y="57" width="41" height="46" fill="#003893"/>
  <rect x="102" y="57" width="41" height="46" fill="#c41e3a"/>
  <rect x="57" y="107" width="41" height="46" fill="#c41e3a"/>
  <rect x="102" y="107" width="41" height="46" fill="#003893"/>

  <!-- Biblia abierta (centro) -->
  <rect x="82" y="88" width="36" height="28" rx="2" fill="#f5f0dc" stroke="#8b7d3c" stroke-width="1"/>
  <line x1="100" y1="88" x2="100" y2="116" stroke="#8b7d3c" stroke-width="0.8"/>
  <!-- Texto biblia simulado -->
  <line x1="86" y1="95" x2="97" y2="95" stroke="#555" stroke-width="0.5"/>
  <line x1="86" y1="98" x2="97" y2="98" stroke="#555" stroke-width="0.5"/>
  <line x1="86" y1="101" x2="97" y2="101" stroke="#555" stroke-width="0.5"/>
  <line x1="86" y1="104" x2="96" y2="104" stroke="#555" stroke-width="0.5"/>
  <line x1="103" y1="95" x2="114" y2="95" stroke="#555" stroke-width="0.5"/>
  <line x1="103" y1="98" x2="114" y2="98" stroke="#555" stroke-width="0.5"/>
  <line x1="103" y1="101" x2="114" y2="101" stroke="#555" stroke-width="0.5"/>
  <line x1="103" y1="104" x2="113" y2="104" stroke="#555" stroke-width="0.5"/>

  <!-- Cruz dorada sobre biblia -->
  <line x1="100" y1="78" x2="100" y2="92" stroke="#c8a415" stroke-width="2.5"/>
  <line x1="94" y1="83" x2="106" y2="83" stroke="#c8a415" stroke-width="2.5"/>

  <!-- Lanzas -->
  <line x1="80" y1="65" x2="73" y2="50" stroke="#555" stroke-width="1.5"/>
  <polygon points="73,50 70,56 76,56" fill="#555"/>
  <line x1="120" y1="65" x2="127" y2="50" stroke="#555" stroke-width="1.5"/>
  <polygon points="127,50 124,56 130,56" fill="#555"/>

  <!-- Cinta superior: DIOS PATRIA LIBERTAD -->
  <path d="M45,48 Q100,30 155,48" fill="#003893" stroke="#c8a415" stroke-width="0.8"/>
  <path d="M45,48 Q100,38 155,48" fill="#003893"/>
  <text x="100" y="46" text-anchor="middle" fill="#fff" font-size="7" font-weight="bold" font-family="serif">DIOS PATRIA LIBERTAD</text>

  <!-- Cinta inferior: REPUBLICA DOMINICANA -->
  <path d="M50,165 Q100,185 150,165" fill="#c41e3a" stroke="#c8a415" stroke-width="0.8"/>
  <path d="M50,165 Q100,178 150,165" fill="#c41e3a"/>
  <text x="100" y="177" text-anchor="middle" fill="#fff" font-size="6.5" font-weight="bold" font-family="serif">REPUBLICA DOMINICANA</text>
</svg>
