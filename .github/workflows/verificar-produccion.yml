name: Verificar produccion

# Chequeo de solo lectura contra los endpoints publicos de salud en Railway.
on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/verificar-produccion.yml", "scripts/verificar_produccion.sh",
            "scripts/diagnostico_sirevuce.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostico del HTML de SIREVUCE
        run: bash scripts/diagnostico_sirevuce.sh
      - name: Esperar despliegue y verificar endpoints
        run: bash scripts/verificar_produccion.sh
        env:
          # En push a main se espera ese commit; en PR o ejecucion manual, lo que este desplegado.
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
