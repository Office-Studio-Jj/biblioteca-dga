[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'PYTHONIOENCODING=utf-8 PYTHONUTF8=1 gunicorn --bind 0.0.0.0:${PORT:-8080} --timeout 60 --workers 1 --worker-class gthread --threads 4 --preload server:app'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[mounts]]
source = "data"
destination = "/data"
